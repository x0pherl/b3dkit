[project]
name = "b3dkit"
version = "0.3.3"
authors = [
  { name="x0pherl"},
]
description = "build123d libraries and utilities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["build123d", "cad", "3d-printing", "parametric", "opencascade"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
  "build123d>=0.11.0",
]

[project.optional-dependencies]
# ocp_vscode is only used by the __main__ demo blocks, never by library code.
viewer = [
  "ocp_vscode>=3.1.1",
]
dev = [
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "b3dkit[viewer]",
  ]
maintain =[
  "twine>=6.2.0",
  "hatch-vcs>=0.5.0",
  "hatchling>=1.29.0",
  "build>=1.4.0",
]
docs = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
  "markdown-include>=0.8.1",
]

[project.urls]
Homepage = "https://github.com/x0pherl/b3dkit"
Issues = "https://github.com/x0pherl/b3dkit/issues"
Documentation = "https://b3dkit.readthedocs.io"

[build-system]
requires = ["hatchling>=1.29.0"]

build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "manual: marks tests that can only be executed manually",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is black's job
    "B008",  # build123d builder-context idioms call in argument defaults
    # build123d's builder pattern is `with BuildPart() as p:` where the binding
    # is often unused -- the context manager does the work. 10 of the 12 F841
    # hits in this package are that idiom, so the rule costs more than it earns.
    "F841",
]

[tool.ruff.lint.per-file-ignores]
# demo blocks under __main__ import the viewer after the module body starts
"src/b3dkit/*.py" = ["E402"]
